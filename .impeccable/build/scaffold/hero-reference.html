<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-02.webp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1586px">
  <div class="r-brand region text" data-region="brand"><!-- PacientPlans wordmark in navy at top left --><p style="font-size:var(--r-brand-font);line-height:1.05;margin:0">brand</p></div>
  <div class="r-nav-sobre region text" data-region="nav-sobre"><!-- Sobre navigation link --><p style="font-size:var(--r-nav-sobre-font);line-height:1.05;margin:0">nav-sobre</p></div>
  <div class="r-nav-tecnologias region text" data-region="nav-tecnologias"><!-- Tecnologias navigation link --><p style="font-size:var(--r-nav-tecnologias-font);line-height:1.05;margin:0">nav-tecnologias</p></div>
  <div class="r-nav-projeto region text" data-region="nav-projeto"><!-- O projeto navigation link --><p style="font-size:var(--r-nav-projeto-font);line-height:1.05;margin:0">nav-projeto</p></div>
  <div class="r-nav-contato region text" data-region="nav-contato"><!-- Contato navigation link --><p style="font-size:var(--r-nav-contato-font);line-height:1.05;margin:0">nav-contato</p></div>
  <div class="r-eyebrow region text" data-region="eyebrow"><!-- PORTFÓLIO DE ESTÁGIO uppercase eyebrow --><p style="font-size:var(--r-eyebrow-font);line-height:1.05;margin:0">eyebrow</p></div>
  <div class="r-headline region text" data-region="headline"><!-- Gestão clínica em um só lugar centered headline --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-primary-action region control" data-region="primary-action"><!-- Blue Conheça o projeto button with arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop primary-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-proof-sections region chrome" data-region="proof-sections"><!-- Outlined section icon and 7 seções proof item --></div>
  <div class="r-proof-stack region chrome" data-region="proof-stack"><!-- Code icon and React + Spring Boot proof item --></div>
  <div class="r-proof-progress region chrome" data-region="proof-progress"><!-- Upward trend icon and Projeto em evolução proof item --></div>
  <div class="r-product-shell region chrome" data-region="product-shell"><!-- Large light browser window containing the PacientPlans dashboard --></div>
  <div class="r-browser-toolbar region chrome" data-region="browser-toolbar"><!-- Browser toolbar with traffic lights and address field --></div>
  <div class="r-product-sidebar region chrome" data-region="product-sidebar"><!-- Dashboard side navigation with brand and five menu items --></div>
  <div class="r-dashboard-heading region text" data-region="dashboard-heading"><!-- Dashboard heading with clinical overview subtitle --><p style="font-size:var(--r-dashboard-heading-font);line-height:1.05;margin:0">dashboard-heading</p></div>
  <div class="r-dashboard-user region chrome" data-region="dashboard-user"><!-- Notification icon and psychologist profile summary --></div>
  <div class="r-stat-patients region chrome" data-region="stat-patients"><!-- Patients statistic card with count and label --></div>
  <div class="r-stat-sessions region chrome" data-region="stat-sessions"><!-- Sessions statistic card with count and label --></div>
  <div class="r-stat-revenue region chrome" data-region="stat-revenue"><!-- Monthly revenue statistic card with amount and label --></div>
  <div class="r-stat-reports region chrome" data-region="stat-reports"><!-- Reports statistic card with count and label --></div>
  <div class="r-sessions-panel region chrome" data-region="sessions-panel"><!-- Upcoming sessions table with three rows and view-all action --></div>
  <div class="r-patients-panel region chrome" data-region="patients-panel"><!-- Patients in follow-up table with three active status rows --></div>
</main>
</body>
</html>
